<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartão de Ponto · VEPAN Service</title>
<style>
:root{--bg:#f3f4f9;--c:#fff;--t:#1a1a3a;--m:#6a6d86;--p:#33337c;--pd:#33337c;--pt:#fff;--soft:#ecedf7;--b:#e1e3ee;--ok:#1b7f4b;--okb:#e6f4ec;--d:#b3261e;--sh:0 1px 2px rgba(35,35,90,.06),0 6px 20px rgba(35,35,90,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f22;--c:#171934;--t:#e8e9f6;--m:#9a9dbd;--p:#7678de;--pd:#25255e;--pt:#fff;--soft:#22244a;--b:#2b2e57;--ok:#4cc77a;--okb:#14301f;--d:#f1786c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 "Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* app */
.lgb,.lgw{display:block;height:42px;width:auto}.lgw{display:none}
@media(prefers-color-scheme:dark){.lgb{display:none}.lgw{display:block}}
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 14px 18px;background:linear-gradient(180deg,var(--pd),#23235a);color:#fff}
.sb{padding:4px 10px 26px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}.sb img{height:34px;display:block}
aside nav{display:flex;flex-direction:column;gap:4px;flex:1;padding:0;background:none;border:0;box-shadow:none;overflow:visible}
aside nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:none;color:rgba(255,255,255,.72);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:left;transition:.15s}
aside nav button svg{width:20px;height:20px;flex:none}
aside nav button:hover{background:rgba(255,255,255,.08);color:#fff}
aside nav button.on{background:#fff;color:#33337c;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.12)}
.me>div:nth-child(2){flex:1;min-width:0}.me b{display:block;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{color:rgba(255,255,255,.6);font-size:11px}
.me button,.mt button{border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}.me button:hover,.mt button:hover{background:rgba(255,255,255,.2)}
.me svg,.mt svg{width:18px;height:18px}
.av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mt{display:none}
.tb{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px;max-width:1000px;margin:0 auto;padding:30px 20px 0}
.tb h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}.tb span{color:var(--m);font-size:14px;text-transform:capitalize}
main{max-width:1000px;margin:0 auto;padding:20px 20px 48px}
@media(max-width:860px){.shell{display:block}.mt{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pd);position:sticky;top:0;z-index:5}.mt img{height:28px}
aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:6;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--c);border-top:1px solid var(--b);box-shadow:0 -6px 20px rgba(20,20,70,.08)}.sb,.me{display:none}
aside nav{flex-direction:row;justify-content:space-around;gap:0}
aside nav button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;color:var(--m);border-radius:10px;text-align:center}aside nav button.on{background:var(--soft);color:var(--p);box-shadow:none}
.tb{padding:20px 16px 0}.tb h1{font-size:22px}main{padding:14px 16px 100px}}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h2{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--b);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label{display:block;font-size:12px;color:var(--m);font-weight:600;letter-spacing:.02em}
input,select{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--soft)}
.bt{border:1px solid var(--pd);background:var(--pd);color:var(--pt);padding:10px 18px;border-radius:6px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:filter .15s}
.bt:hover{filter:brightness(1.15)}.bt:disabled{opacity:.4;cursor:not-allowed;filter:none}
.bt.sec{background:transparent;color:var(--p);border-color:var(--b)}.bt.sec:hover{background:var(--soft);filter:none;border-color:var(--p)}
.bt.rd{background:transparent;color:var(--d);border-color:transparent;padding:6px 10px}.bt.rd:hover{background:var(--soft);filter:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
/* ponto */
.clk{font-size:clamp(46px,11vw,72px);font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1;color:var(--p)}
.cam{position:relative;width:100%;max-width:320px;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#101126;margin:14px 0}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.cam i{position:absolute;inset:15%;border:2px solid rgba(255,255,255,.7);border-radius:50%;box-shadow:0 0 0 999px rgba(16,17,38,.35)}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sl div{border:1px solid var(--b);background:var(--bg);border-radius:8px;padding:12px;text-align:left;font-size:12px;color:var(--m);font-weight:600;letter-spacing:.03em}
.sl div.f{background:var(--soft);border-color:var(--p);color:var(--p)}
.sl strong{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--t)}.sl div.f strong{color:var(--p)}
.top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}.top>*{flex:1 1 300px}.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
th{color:var(--m);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--bg)}tr:hover td{background:var(--bg)}
td img{width:38px;height:38px;border-radius:6px;object-fit:cover;vertical-align:middle}.tag{font-size:13px;color:var(--m)}
.lk{display:inline-block;font-size:11px;font-weight:600;color:var(--p);text-decoration:none;margin-top:2px}.lk:hover{text-decoration:underline}.lc2{font-size:11px;color:var(--m)}
.msg{max-width:78%;padding:9px 13px;border-radius:12px 12px 12px 3px;margin:8px 0;background:var(--soft)}
.msg.me{margin-left:auto;background:var(--pd);color:var(--pt);border-radius:12px 12px 3px 12px}.msg small{display:block;opacity:.7;font-size:11px;margin-bottom:2px}
.th{max-height:340px;overflow-y:auto;margin-bottom:12px;padding-right:4px}.row{display:flex;gap:8px}.row input{margin:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pd);color:#fff;padding:11px 20px;border-radius:8px;font-weight:600;font-size:14px;z-index:9;max-width:90%;box-shadow:0 8px 24px rgba(20,20,60,.3)}
.eh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--pd)}
.eh .lgb,.eh .lgw{height:42px}.eh h2{margin:0;padding:0;border:0;font-size:14px}
/* login */
.lg{--c:#fff;--t:#1a1a3a;--m:#6a6d86;--b:#e1e3ee;--p:#33337c;--pd:#33337c;--soft:#ecedf7;--bg:#f3f4f9;--pt:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:radial-gradient(800px 480px at 12% -8%,#4b4bad 0,transparent 62%),radial-gradient(700px 500px at 105% 108%,#1d1d52 0,transparent 60%),#33337c;color:var(--t)}
.lg .lgb{display:block!important}.lg .lgw{display:none!important}
.lc{width:100%;max-width:400px;background:var(--c);border-radius:20px;padding:38px 34px 30px;box-shadow:0 32px 70px rgba(8,8,45,.45)}
.lc .lgb,.lc .lgw{height:50px;margin:0 auto 26px}
.lc h1{margin:0;font-size:22px;font-weight:700;text-align:center}.lc .tag{text-align:center;margin:4px 0 24px}
.lc label{margin-bottom:14px}.lc input{height:46px;border-radius:10px;margin-top:6px}
.lc .bt{width:100%;height:48px;border-radius:10px;font-size:15px;margin-top:6px}
.lt{margin-top:22px;padding-top:16px;border-top:1px solid var(--b);text-align:center;font-size:12px;color:var(--m)}
.lf2{color:rgba(255,255,255,.65);font-size:12px}
@media print{.np{display:none!important}.shell{display:block}body{background:#fff;color:#000}main{padding:0;max-width:none}.card{border:0;box-shadow:none}.lgb{display:block!important}.lgw{display:none!important}}
</style></head><body><div id="app"></div><div id="toast" hidden></div>

const loc=()=>new Promise(r=>{if(!navigator.geolocation)return r({erro:'Seu navegador não suporta localização.'});navigator.geolocation.getCurrentPosition(p=>r({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),e=>r({erro:e.code==1?'Permita o acesso à localização para bater o ponto.':'Não foi possível obter a localização. Tente novamente.'}),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3500)}
async function api(p,o={}){const fm=o.body instanceof FormData;
 const r=await fetch('/api'+p,{method:o.method,credentials:'same-origin',headers:o.body&&!fm?{'Content-Type':'application/json'}:undefined,body:o.body&&!fm?JSON.stringify(o.body):o.body});
 if(r.status==401&&p!='/login'){if(p!='/me'){S.u=null;render()}return null}
 const d=await r.json().catch(()=>({}));if(!r.ok){toast(d.erro||'Erro inesperado');return null}return d}

async function cam(){stop();const v=$('#v');if(!v)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640}});v.srcObject=stream;await v.play()}catch(e){$('#cm').outerHTML='<p class="tag">Câmera indisponível. Permita o acesso à câmera no navegador.</p>'}}
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
function frame(){const v=$('#v');if(!v||!v.videoWidth)return null;const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}
async function frames(n=4){const o=[];for(let i=0;i<n;i++){const f=frame();if(!f){toast('Câmera não está pronta.');return null}o.push(f);await new Promise(r=>setTimeout(r,400))}return o}

function render(){stop();const a=$('#app');
 if(!S.u){a.innerHTML=`<div class="lg"><div class="lc">${brand()}<h1>Bem-vindo</h1><p class="tag">Acesse com sua matrícula e senha</p><label>Matrícula<input id="m" autocomplete="username"></label><label>Senha<input id="s" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()"></label><button class="bt" onclick="login()">Entrar</button><div class="lt">Registro de ponto com reconhecimento facial</div></div><div class="lf2">© ${new Date().getFullYear()} VEPAN Service</div></div>`;return}
 const adm=S.u.role=='admin',T=adm?[['func','Funcionários'],['reg','Registros'],['esp','Espelho de ponto'],['doc','Documentos'],['msg','Mensagens']]:[['ponto','Bater ponto'],['esp','Meu espelho'],['doc','Documentos'],['msg','Mensagens']],cur=T.find(t=>t[0]==S.tab)||T[0],nm=S.u.nome.trim();
 a.innerHTML=`<div class="shell"><aside class="np"><div class="sb">${brandW()}</div><nav>${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${ic(t[0])}<span>${t[1]}</span></button>`).join('')}</nav><div class="me"><div class="av">${esc(nm.charAt(0).toUpperCase())}</div><div><b>${esc(nm)}</b><small>${adm?'Administração':'Funcionário'}</small></div><button onclick="logout()" title="Sair" aria-label="Sair">${ic('out')}</button></div></aside><div class="mc"><div class="mt np">${brandW()}<button onclick="logout()" aria-label="Sair">${ic('out')}</button></div><div class="tb np"><h1>${cur[1]}</h1><span>Olá, ${esc(nm.split(' ')[0])} · ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</span></div><main id="main"></main></div></div>`;V[S.tab]()}
let users=[];
async function sel(v,fn,all){users=await api('/users')||[];return`<select onchange="${fn}">${all?'<option value="">Todos</option>':'<option value="">Selecione</option>'}${users.map(u=>`<option value="${u.id}" ${u.id==v?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>`}
const V={
async ponto(){const L=(await api('/punches?dia='+new Date().toLocaleDateString('sv')))||[],tp=L.slice().reverse(),n=tp.length;
 $('#main').innerHTML=`<div class="top"><div class="card"><div class="tag">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="clk" id="clk"></div>${CAM}<button class="bt" id="pb" ${n>3?'disabled':''} onclick="punch()">${n>3?'Jornada concluída':'Registrar '+TY[n].toLowerCase()}</button></div><div class="card"><h2>Hoje</h2><div class="sl">${TY.map((t,i)=>`<div class="${tp[i]?'f':''}">${t}<strong>${tp[i]?ft(tp[i].ts):'--:--'}</strong></div>`).join('')}</div></div></div>`;tick();cam()},
async func(){users=await api('/users')||[];
 $('#main').innerHTML=`<div class="top"><div class="card"><h2>Novo funcionário</h2><div class="g"><label>Nome<input id="fn"></label><label>Matrícula<input id="fm"></label><label>Senha<input id="fs" type="password"></label><label>Cargo<input id="fc"></label></div>${CAM}<p class="tag">Rosto centralizado, boa luz, sem óculos escuros. Serão tiradas 4 fotos.</p><button class="bt" onclick="addU()">Cadastrar com rosto</button></div><div class="card"><h2>Equipe</h2><div class="tw"><table><tr><th>Nome</th><th>Matrícula</th><th>Rosto</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.nome)}<div class="tag">${esc(u.cargo||'')}</div></td><td>${esc(u.mat)}</td><td>${u.face?'Cadastrado':'Pendente'}</td><td><button class="bt sec" onclick="reface(${u.id})">Novo rosto</button> <button class="bt rd" onclick="delU(${u.id})">Remover</button></td></tr>`).join('')||'<tr><td>Nenhum funcionário cadastrado.</td></tr>'}</table></div><p class="tag">&quot;Novo rosto&quot; usa a câmera ao lado, com a pessoa à frente.</p></div></div>`;cam()},
async reg(){const s=await sel(S.sel,'S.sel=this.value;V.reg()',1),L=(await api(`/punches?uid=${S.sel}&dia=${S.dia}`))||[];
 $('#main').innerHTML=`<div class="card"><h2>Registros de todos</h2><div class="g"><label>Funcionário${s}</label><label>Data<input type="date" value="${S.dia}" onchange="S.dia=this.value;V.reg()"></label></div><br><div class="tw"><table><tr><th>Foto</th><th>Funcionário</th><th>Data</th><th>Hora</th><th>Tipo</th><th>Similaridade</th><th>Localização</th></tr>${L.map(p=>`<tr><td>${p.foto?`<img src="${p.foto}" alt="">`:''}</td><td>${esc(p.nome)}</td><td>${fd(p.ts)}</td><td>${ft(p.ts)}</td><td>${TY[p.tipo]}</td><td>${Math.round(p.score*100)}%</td><td>${LK(p)||'<span class="tag">--</span>'}</td></tr>`).join('')||'<tr><td>Nenhum registro.</td></tr>'}</table></div></div>`},
async esp(){const adm=S.u.role=='admin',s=adm?await sel(S.sel,'S.sel=this.value;V.esp()'):'',q=`uid=${adm?S.sel:''}&mon=${S.mon}`,d=(!adm||S.sel)?await api('/mirror?'+q):null;
 $('#main').innerHTML=`<div class="card np"><h2>Espelho de ponto</h2><div class="g">${adm?`<label>Funcionário${s}</label>`:''}<label>Mês<input type="month" value="${S.mon}" onchange="S.mon=this.value;V.esp()"></label></div>${d?`<br><button class="bt" onclick="print()">Imprimir / salvar PDF</button> <a class="bt sec" style="text-decoration:none;display:inline-block" href="/api/mirror.csv?${q}">Baixar CSV</a>`:''}</div>${d?`<div class="card"><div class="eh">${brand()}<h2>Espelho de ponto</h2></div><p><b>${esc(d.user.nome)}</b><br><span class="tag">Matrícula ${esc(d.user.mat)} · ${esc(d.user.cargo||'')} · Competência ${S.mon.split('-').reverse().join('/')}</span></p><div class="tw"><table><tr><th>Dia</th>${TY.map(t=>`<th>${t}</th>`).join('')}<th>Trabalhado</th></tr>${d.rows.map(r=>`<tr><td>${r.dia} ${r.sem}</td>${[0,1,2,3].map(i=>`<td>${r.bat[i]||'--'}${r.bat[i]?LK(r.loc&&r.loc[i]):''}</td>`).join('')}<td>${r.min?hm(r.min):'--'}</td></tr>`).join('')}<tr><th colspan="5">Total do mês</th><th>${hm(d.total)}</th></tr></table></div><br><br><p>_______________________________ &nbsp; _______________________________<br><span class="tag">Assinatura do funcionário &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Responsável</span></p></div>`:'<p class="tag">Escolha um funcionário para gerar o espelho.</p>'}`},
async doc(){const adm=S.u.role=='admin',L=(await api('/docs'))||[];
 $('#main').innerHTML=`${adm?'':`<div class="card"><h2>Enviar documento</h2><div class="g"><label>Tipo<select id="dt"><option>Atestado</option><option>Comprovante</option><option>Justificativa</option><option>Outro</option></select></label><label>Arquivo (PDF, PNG ou JPG)<input type="file" id="df" accept="image/*,.pdf"></label></div><br><button class="bt" onclick="upDoc()">Enviar</button></div>`}<div class="card"><h2>Documentos</h2><div class="tw"><table><tr>${adm?'<th>Funcionário</th>':''}<th>Tipo</th><th>Arquivo</th><th>Enviado</th><th></th></tr>${L.map(d=>`<tr>${adm?`<td>${esc(d.nome_func)}</td>`:''}<td>${esc(d.tipo)}</td><td>${esc(d.nome)}</td><td>${fd(d.ts)}</td><td><a class="bt sec" style="text-decoration:none" target="_blank" href="/api/docs/${d.id}/file">Abrir</a> <button class="bt rd" onclick="delDoc(${d.id})">Excluir</button></td></tr>`).join('')||'<tr><td>Nenhum documento enviado.</td></tr>'}</table></div></div>`},
async msg(){const adm=S.u.role=='admin',s=adm?await sel(S.sel,'S.sel=this.value;V.msg()'):'',L=(!adm||S.sel)?(await api('/msgs?uid='+S.sel))||[]:null;
 $('#main').innerHTML=`<div class="card"><h2>Mensagens</h2>${adm?`<label>Conversa com${s}</label><br>`:''}${L?`<div class="th" id="th">${L.map(m=>`<div class="msg ${(m.de=='admin')==adm?'me':''}"><small>${m.de=='admin'?'Administração':'Funcionário'} · ${fd(m.ts)} ${ft(m.ts)}</small>${esc(m.txt)}</div>`).join('')||'<p class="tag">Nenhuma mensagem ainda.</p>'}</div><div class="row"><input id="mt" placeholder="Escreva uma mensagem" onkeydown="event.key==\'Enter\'&&sendM()"><button class="bt" onclick="sendM()">Enviar</button></div>`:'<p class="tag">Escolha um funcionário para ver a conversa.</p>'}</div>`;const t=$('#th');t&&(t.scrollTop=t.scrollHeight)}};
function tick(){const e=$('#clk');if(!e)return;e.textContent=new Date().toLocaleTimeString('pt-BR');setTimeout(tick,1000)}
async function punch(){const b=$('#pb'),t0=b.textContent,undo=()=>{b.disabled=false;b.textContent=t0};b.disabled=true;b.textContent='Obtendo localização...';
 const g=await loc();if(g.erro){toast(g.erro);return undo()}
 const img=frame();if(!img){toast('Câmera não está pronta.');return undo()}
 b.textContent='Verificando rosto...';
 const d=await api('/punch',{method:'POST',body:{image:img,lat:g.lat,lng:g.lng,acc:g.acc}});if(d)toast(`${TY[d.tipo]} registrada às ${ft(d.ts)}`);V.ponto()}
async function addU(){const im=await frames();if(!im)return;const d=await api('/users',{method:'POST',body:{nome:$('#fn').value,mat:$('#fm').value,senha:$('#fs').value,cargo:$('#fc').value,images:im}});if(d){toast('Funcionário cadastrado.');V.func()}}
async function reface(id){toast('Mantenha o rosto na câmera...');const im=await frames();if(im&&await api(`/users/${id}/face`,{method:'POST',body:{images:im}}))toast('Rosto atualizado.');V.func()}
async function delU(id){if(confirm('Remover funcionário e todos os seus dados?')&&await api('/users/'+id,{method:'DELETE'}))V.func()}
async function upDoc(){const f=$('#df').files[0];if(!f)return toast('Escolha um arquivo.');const fm=new FormData();fm.append('file',f);fm.append('tipo',$('#dt').value);if(await api('/docs',{method:'POST',body:fm})){toast('Documento enviado.');V.doc()}}
async function delDoc(id){if(confirm('Excluir documento?')&&await api('/docs/'+id,{method:'DELETE'}))V.doc()}
async function sendM(){const t=$('#mt').value.trim();if(t&&await api('/msgs',{method:'POST',body:{txt:t,uid:S.sel}}))V.msg()}
(async()=>{const d=await api('/me');if(d){S.u=d;S.tab=d.role=='admin'?'func':'ponto'}render()})();
</script></body></html>

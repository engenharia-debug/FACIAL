databases:
  - name: ponto-db
    databaseName: ponto
    user: ponto
    plan: free
services:
  - type: web
    name: ponto-digital
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python download_models.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_MAT
        value: admin
      - key: TZ_NAME
        value: America/Sao_Paulo
      - key: FACE_THRESHOLD
        value: "0.45"
